[project]
name = "sabbazaar"
version = "0.1.0"
description = "SabBazaar backend: bill intake, catalogue, and channel publishing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/contracts",
    "packages/commerce",
    "packages/connectors",
    "packages/agents",
    "apps/api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # FastAPI File()/Depends() defaults; formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["contracts", "commerce", "connectors", "agents", "api"]

