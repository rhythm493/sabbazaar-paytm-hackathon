[project]
name = "sabbazaar-connectors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "sabbazaar-contracts",
    "shopifyapp>=1.1.0",
]

[tool.uv.sources]
sabbazaar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabbazaar_connectors"]
