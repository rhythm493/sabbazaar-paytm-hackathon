[project]
name = "sabbazaar-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-openai>=1.0,<2",
    "sabbazaar-contracts",
    "sabbazaar-commerce",
]

[tool.uv.sources]
sabbazaar-contracts = { workspace = true }
sabbazaar-commerce = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabbazaar_agents"]
