[project]
name = "sabbazaar"
version = "0.1.0"
description = "SabBazaar six-hour Shopify-first merchant catalogue prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "sabbazaar-contracts",
    "sabbazaar-commerce",
    "sabbazaar-connectors",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[tool.uv.sources]
sabbazaar-contracts = { workspace = true }
sabbazaar-commerce = { workspace = true }
sabbazaar-connectors = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/commerce",
    "packages/connectors",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
